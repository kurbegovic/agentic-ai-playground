# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: workflows
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-5.4-mini
                version: "2026-03-17"
              name: gpt-5.4-mini
              sku:
                capacity: 50
                name: GlobalStandard
    workflows:
        project: src/workflows
        host: azure.ai.agent
        language: csharp
        uses:
            - ai-project
        codeConfiguration:
            entryPoint: workflows.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: A workflow agent that performs sequential logs analysis and DevOps issue management tasks.
        displayName: DevOps Logs Workflow Agent
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Agent Framework
                - Workflows
        name: workflows
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
